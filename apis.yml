- aid: beyond-identity:beyond-identity-sso-configs-api
  name: Beyond Identity SSO Configs API
  description: >-
    An SSO configuration defines how end users interact with supported SSO protocols and related services.
    Each configuration type represents a protocol or integration (e.g., SAML, WS-Federation, OIDC, SCIM)
    supported by Beyond Identity. An SSO configuration provides a flexible framework for managing authentication,
    provisioning, and other integrations. It abstracts application protocols, inbound and outbound provisioning,
    and supports named integrations. Additionally, it includes features like user or group assignments,
    visual tiles in the SSO interface, and compatibility with multiple authentication and provisioning
    standards.  This makes SSO configurations versatile for both authentication and non-authentication
    use cases.
  humanURL: https://developer.beyondidentity.com/api/v1
  baseURL: https://api-us.beyondidentity.com
  tags:
  - SSO Configs
